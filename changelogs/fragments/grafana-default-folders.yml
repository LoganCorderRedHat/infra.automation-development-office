---
minor_changes:
  - >-
    grafana_manage_folders - Default Grafana folders are Applications,
    Security, and Infrastucture. Each dashboards path defaults to
    ``dashboards/<folder name>`` and stays editable. Alert paths are no
    longer part of those folder rows. The shipped OpenShift dashboards
    upload into Infrastucture and the RHACS dashboard into Security when
    ``grafana_include_builtin_dashboards`` is true. Extra dashboard
    sources use one of those folder names. Alert upload starts from a
    separate ``Alerts`` folder at ``alerts/Alerts``. When Keycloak is
    selected and populated, the Grafana OIDC issuer URL is filled from
    the Keycloak hostname and realm. Pre-canned dashboards can be
    chosen one by one. The copied files are the lab dashboards under
    ``dashboards/<folder name>``. ``builtin_dashboards`` limits which
    of those files upload. Default OpenShift alert rules ship in
    ``alerts/Alerts`` for node readiness, node CPU, CrashLoopBackOff,
    a namespace whose Service has no endpoints, node or pod memory,
    and network drops or errors.

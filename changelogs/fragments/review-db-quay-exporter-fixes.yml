---
bugfixes:
  - >-
    ocp_aap_hub_harden - ``pg_restore`` must succeed before Hub is
    pointed at dedicated Postgres. The dedicated-database secret and
    maintenance CronJob are applied only when separation is enabled or
    Hub is already on that secret.
  - >-
    keycloak_login_events_exporter - Skip the role with a task ``when``
    instead of ``meta: end_role``, which ansible-core 2.17 rejects.
  - >-
    ocp_quay - Hash the existing admin password with libcrypt and store
    it in ``password_hash``. Empty MinIO host, port, namespace, and
    access-key placeholders inherit ``vars_minio.yml``.
  - >-
    gitlab_install / ocp_zabbix - Bind ``anyuid`` to the dedicated
    Postgres ServiceAccount instead of the namespace ``default`` account.

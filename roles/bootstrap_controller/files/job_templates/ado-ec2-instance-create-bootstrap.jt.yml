---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Create EC2 instance
    description: >-
      Bootstrap - Create an EC2 instance via
      infra.ado.aws.ec2.ado-ec2-instance-create
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/aws/ec2/ado-ec2-instance-create-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | aws
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Create EC2 instance Survey
      description: Create EC2 instance options
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vault_aws / vars_ec2_instance)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Instance name
          question_description: Name tag for the instance
          required: true
          type: text
          variable: ec2_instance_name
          default: ""
        - question_name: ADO | AMI ID
          question_description: AMI ID (for example ami-0123456789abcdef0)
          required: true
          type: text
          variable: ec2_instance_image_id
          default: ""
        - question_name: ADO | Instance type
          question_description: EC2 instance type
          required: true
          type: text
          variable: ec2_instance_type
          default: t3.small
        - question_name: ADO | Subnet ID
          question_description: VPC subnet ID
          required: true
          type: text
          variable: ec2_instance_subnet_id
          default: ""
        - question_name: ADO | Key pair name (optional)
          question_description: SSH key pair name
          required: false
          type: text
          variable: ec2_instance_key_name
          default: ""
        - question_name: ADO | Security group (optional)
          question_description: Security group ID or name
          required: false
          type: text
          variable: ec2_instance_security_group
          default: ""
        - question_name: ADO | Assign public IP?
          question_description: Assign a public IP on the primary interface
          required: true
          type: multiplechoice
          variable: ec2_instance_assign_public_ip
          choices: "true\nfalse"
          default: "false"
# yamllint enable rule:line-length

---
# yamllint disable rule:line-length
controller_templates:
  - name: ADO | Shift on Shift | Scale node pool
    description: Change NodePool replicas or autoscaling for one hosted cluster
    organization: '{{ bootstrap_controller_organization }}'
    playbook: playbooks/shift_on_shift/ado-shift-on-shift-scale-bootstrap.yml
    inventory: '{{ bootstrap_controller_inventory_name }}'
    project: '{{ bootstrap_controller_project_name }}'
    execution_environment: '{{ bootstrap_controller_execution_environment_name }}'
    credentials:
      - '{{ bootstrap_controller_creds }}'
    related: null
    labels:
      - name: ADO | bootstrap
        organization: '{{ bootstrap_controller_organization }}'
      - name: ADO | shift_on_shift
        organization: '{{ bootstrap_controller_organization }}'
    extra_vars: {}
    survey_enabled: true
    survey_spec:
      name: ADO | Shift on Shift | Scale node pool Survey
      description: Set replicas, or autoscaling min and max (not both)
      spec:
        - question_name: ADO | What environment?
          question_description: Target environment (loads vars_shift_on_shift / vault_shift_on_shift)
          required: true
          type: multiplechoice
          variable: env
          choices: '{{ bootstrap_controller_environment_choices }}'
          default: '{{ bootstrap_controller_default_environment }}'
        - question_name: ADO | Hosted cluster name
          question_description: Exactly one hosted cluster from vars_shift_on_shift.yml.
          required: true
          type: text
          variable: shift_on_shift_cluster_name
          default: ""
        - question_name: ADO | NodePool name
          question_description: Empty uses the default node pool of the hosted cluster.
          required: false
          type: text
          variable: shift_on_shift_nodepool_name
          default: ""
        - question_name: ADO | Replicas
          question_description: Worker VM count (0 or more). Leave empty when using autoscaling.
          required: false
          type: text
          variable: shift_on_shift_replicas
          default: ""
        - question_name: ADO | Autoscaling minimum
          question_description: Minimum workers (1 or more). Leave empty for a fixed replica count.
          required: false
          type: text
          variable: shift_on_shift_autoscaling_min
          default: ""
        - question_name: ADO | Autoscaling maximum
          question_description: Maximum workers (greater than or equal to the minimum).
          required: false
          type: text
          variable: shift_on_shift_autoscaling_max
          default: ""

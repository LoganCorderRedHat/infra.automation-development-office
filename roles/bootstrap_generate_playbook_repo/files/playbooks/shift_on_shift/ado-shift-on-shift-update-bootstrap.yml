---
# yamllint disable rule:line-length
# Generated by infra.automation_development_office bootstrap (Shift on Shift).
# Day-2: channel, autoRepair, control plane release, then node pool release. Release changes need explicit confirmation.
- name: ADO | Shift on Shift | Update hosted cluster
  hosts: localhost
  gather_facts: false
  vars:
    component: shift_on_shift
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component

  tasks:
    - name: ADO | Shift on Shift | Update hosted cluster
      ansible.builtin.include_role:
        name: infra.automation_development_office.ocp_hcp_kubevirt_cluster
      vars:
        ocp_hcp_kubevirt_cluster_action: update
        ocp_hcp_kubevirt_cluster_clusters: "{{ shift_on_shift_clusters | default([]) }}"
        ocp_hcp_kubevirt_cluster_cluster_defaults: "{{ shift_on_shift_cluster_defaults | default({}) }}"
        ocp_hcp_kubevirt_cluster_name: "{{ shift_on_shift_cluster_name | default('') }}"
        ocp_hcp_kubevirt_cluster_pull_secrets: "{{ shift_on_shift_pull_secrets | default({}) }}"
        ocp_hcp_kubevirt_cluster_verify_hosted_api: "{{ shift_on_shift_verify_hosted_api | default(true) }}"
        ocp_hcp_kubevirt_cluster_target_release_image: "{{ shift_on_shift_target_release_image | default('') }}"
        ocp_hcp_kubevirt_cluster_target_version: "{{ shift_on_shift_target_version | default('') }}"
        ocp_hcp_kubevirt_cluster_channel: "{{ shift_on_shift_channel | default('') }}"
        ocp_hcp_kubevirt_cluster_auto_repair: "{{ shift_on_shift_auto_repair | default('') }}"
        ocp_hcp_kubevirt_cluster_update_nodepools: "{{ shift_on_shift_update_nodepools | default(false) }}"
        ocp_hcp_kubevirt_cluster_nodepool_name: "{{ shift_on_shift_nodepool_name | default('') }}"
        ocp_hcp_kubevirt_cluster_nodepool_release_image: "{{ shift_on_shift_nodepool_release_image | default('') }}"
        ocp_hcp_kubevirt_cluster_confirm_update: "{{ shift_on_shift_confirm_update | default(false) }}"
        ocp_hcp_kubevirt_cluster_force_upgrade: "{{ shift_on_shift_force_upgrade | default(false) }}"

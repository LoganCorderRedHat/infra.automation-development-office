---
# yamllint disable rule:line-length
# Generated by infra.automation_development_office bootstrap (Shift on Shift).
# Read-only: checks the management cluster for hosted control planes on OpenShift Virtualization.
- name: ADO | Shift on Shift | Validate prerequisites
  hosts: localhost
  gather_facts: false
  vars:
    component: shift_on_shift
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component

  tasks:
    - name: ADO | Shift on Shift | Validate management cluster prerequisites
      ansible.builtin.include_role:
        name: infra.automation_development_office.ocp_hcp_kubevirt_prereqs
      vars:
        ocp_hcp_kubevirt_prereqs_clusters: "{{ shift_on_shift_clusters | default([]) }}"
        ocp_hcp_kubevirt_prereqs_cluster_defaults: "{{ shift_on_shift_cluster_defaults | default({}) }}"
        ocp_hcp_kubevirt_prereqs_cluster_name: "{{ shift_on_shift_cluster_name | default('') }}"
        ocp_hcp_kubevirt_prereqs_pull_secrets: "{{ shift_on_shift_pull_secrets | default({}) }}"
        ocp_hcp_kubevirt_prereqs_wildcard_remediation_planned: >-
          {{ (shift_on_shift_manage_wildcard_route_admission | default(false) | bool) or (shift_on_shift_install_prerequisites | default(false) | bool) }}
        ocp_hcp_kubevirt_prereqs_install_planned: >-
          {{ ['mce', 'virtualization', 'metallb'] if (shift_on_shift_install_prerequisites | default(false) | bool) else [] }}
        ocp_hcp_kubevirt_prereqs_metallb_address_pools: "{{ shift_on_shift_metallb_address_pools | default([]) }}"
        ocp_hcp_kubevirt_prereqs_allow_unsupported_platform: "{{ shift_on_shift_allow_unsupported_platform | default(false) }}"
        ocp_hcp_kubevirt_prereqs_load_balancer_check: "{{ shift_on_shift_load_balancer_check | default('metallb') }}"

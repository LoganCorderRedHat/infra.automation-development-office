---
# yamllint disable rule:line-length
# Generated by infra.automation_development_office bootstrap (Shift on Shift).
# Creates missing hosted clusters; existing HostedClusters are never re-applied or recreated. `state` is ignored.
- name: ADO | Shift on Shift | Deploy hosted clusters
  hosts: localhost
  gather_facts: false
  vars:
    component: shift_on_shift
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/infra_config_vars.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_openshift.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vault_{{ component }}.yml"
    - "{{ playbook_dir }}/../../group_vars/all/{{ env }}/vars_{{ component }}.yml"
  environment:
    K8S_AUTH_HOST: '{{ host | default(api_host) }}'
    K8S_AUTH_API_KEY: '{{ token }}'
    K8S_AUTH_VERIFY_SSL: '{{ (verify_ssl | bool) | ternary(''yes'',''no'') }}'
  pre_tasks:
    - name: ADO | Resolve vars for component from framework defaults + env overrides
      ansible.builtin.include_role:
        name: infra.automation_development_office.bootstrap_resolve_component

  tasks:
    - name: ADO | Shift on Shift | Deploy hosted clusters
      ansible.builtin.include_role:
        name: infra.automation_development_office.ocp_hcp_kubevirt_cluster
      vars:
        ocp_hcp_kubevirt_cluster_action: deploy
        ocp_hcp_kubevirt_cluster_clusters: "{{ shift_on_shift_clusters | default([]) }}"
        ocp_hcp_kubevirt_cluster_cluster_defaults: "{{ shift_on_shift_cluster_defaults | default({}) }}"
        ocp_hcp_kubevirt_cluster_name: "{{ shift_on_shift_cluster_name | default('') }}"
        ocp_hcp_kubevirt_cluster_pull_secrets: "{{ shift_on_shift_pull_secrets | default({}) }}"
        ocp_hcp_kubevirt_cluster_verify_hosted_api: "{{ shift_on_shift_verify_hosted_api | default(true) }}"
        ocp_hcp_kubevirt_cluster_validate: "{{ shift_on_shift_validate_before_deploy | default(true) }}"
        ocp_hcp_kubevirt_cluster_install_prerequisites: "{{ shift_on_shift_install_prerequisites | default(false) }}"
        ocp_hcp_kubevirt_cluster_metallb_address_pools: "{{ shift_on_shift_metallb_address_pools | default([]) }}"
        ocp_hcp_kubevirt_cluster_manage_wildcard_route_admission: "{{ shift_on_shift_manage_wildcard_route_admission | default(false) }}"
        ocp_hcp_kubevirt_cluster_allow_unsupported_platform: "{{ shift_on_shift_allow_unsupported_platform | default(false) }}"
        ocp_hcp_kubevirt_cluster_load_balancer_check: "{{ shift_on_shift_load_balancer_check | default('metallb') }}"

---
# yamllint disable rule:line-length
# Pull secret content is decoded only inside no_log tasks; the recorded result
# keeps validity, the error text, and registry host names.
- name: Shift on Shift prereqs | Read management cluster pull secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: pull-secret
    namespace: openshift-config
  register: ocp_hcp_kubevirt_prereqs__mgmt_pull_secret
  no_log: true
  when: >-
    ocp_hcp_kubevirt_prereqs__definitions.clusters
    | selectattr('pull_secret_source', 'equalto', 'management_cluster')
    | list | length > 0

- name: Shift on Shift prereqs | Read referenced pull secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item.pull_secret_name }}"
    namespace: "{{ item.namespace }}"
  loop: >-
    {{
      ocp_hcp_kubevirt_prereqs__definitions.clusters
      | selectattr('pull_secret_source', 'equalto', 'existing_secret')
      | list
    }}
  loop_control:
    label: "{{ item.namespace }}/{{ item.pull_secret_name }}"
  register: ocp_hcp_kubevirt_prereqs__ref_pull_secrets
  no_log: true

- name: Shift on Shift prereqs | Evaluate pull secrets
  vars:
    ocp_hcp_kubevirt_prereqs__mgmt_ps_obj: "{{ (ocp_hcp_kubevirt_prereqs__mgmt_pull_secret.resources | default([]) | first) | default({}, true) }}"
    ocp_hcp_kubevirt_prereqs__ref_ps_obj: >-
      {{
        (
          (ocp_hcp_kubevirt_prereqs__ref_pull_secrets.results | default([])
           | selectattr('item.name', 'equalto', item.name) | map(attribute='resources') | first)
          | default([]) | first
        ) | default({}, true)
      }}
    ocp_hcp_kubevirt_prereqs__raw_ps: >-
      {{
        (ocp_hcp_kubevirt_prereqs__mgmt_ps_obj.data['.dockerconfigjson'] | default('') | b64decode)
        if item.pull_secret_source == 'management_cluster'
        else (
          ocp_hcp_kubevirt_prereqs_pull_secrets[item.name] | default('')
          if item.pull_secret_source == 'vault'
          else (ocp_hcp_kubevirt_prereqs__ref_ps_obj.data['.dockerconfigjson'] | default('') | b64decode)
        )
      }}
  ansible.builtin.set_fact:
    ocp_hcp_kubevirt_prereqs__pull_secret_results: >-
      {{
        ocp_hcp_kubevirt_prereqs__pull_secret_results | default({})
        | combine({
            item.name: ocp_hcp_kubevirt_prereqs__raw_ps
              | infra.automation_development_office.hcp_kubevirt_pull_secret_check
          })
      }}
  loop: "{{ ocp_hcp_kubevirt_prereqs__definitions.clusters }}"
  loop_control:
    label: "{{ item.name }} ({{ item.pull_secret_source }})"
  no_log: true

---
# yamllint disable rule:line-length
# Loads the hosted admin kubeconfig into memory (no file). Every task that
# uses ocp_hcp_kubevirt_cluster__hosted_kubeconfig must set no_log: true.
- name: Shift on Shift | Read hosted admin kubeconfig secret | {{ ocp_hcp_kubevirt_cluster__def.name }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: >-
      {{
        (ocp_hcp_kubevirt_cluster__hc.status.kubeconfig.name | default(''))
        or (ocp_hcp_kubevirt_cluster__def.name ~ '-admin-kubeconfig')
      }}
    namespace: "{{ ocp_hcp_kubevirt_cluster__def.namespace }}"
  register: ocp_hcp_kubevirt_cluster__kubeconfig_secret
  no_log: true

- name: Shift on Shift | Require hosted admin kubeconfig | {{ ocp_hcp_kubevirt_cluster__def.name }}
  ansible.builtin.assert:
    that:
      - ocp_hcp_kubevirt_cluster__kubeconfig_secret.resources | default([]) | length > 0
    fail_msg: >-
      The admin kubeconfig secret for {{ ocp_hcp_kubevirt_cluster__def.name }} is not available yet
      in namespace {{ ocp_hcp_kubevirt_cluster__def.namespace }}.
    quiet: true

- name: Shift on Shift | Load hosted admin kubeconfig | {{ ocp_hcp_kubevirt_cluster__def.name }}
  ansible.builtin.set_fact:
    ocp_hcp_kubevirt_cluster__hosted_kubeconfig: >-
      {{ (ocp_hcp_kubevirt_cluster__kubeconfig_secret.resources | first).data.kubeconfig | b64decode | from_yaml }}
    ocp_hcp_kubevirt_cluster__kubeconfig_secret: {}
  no_log: true
